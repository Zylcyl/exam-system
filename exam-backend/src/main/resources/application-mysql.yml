# H2 模式（演示/开发用，数据随项目带走）
spring:
  datasource:
    url: jdbc:h2:file:./data/examdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: EMBEDDED

---
# MySQL 模式（生产/高并发用）
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/exam_system?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: your_password
  sql:
    init:
      mode: never
